<a class="build-card" [class]="'status-' + getStatusClass()"
   [href]="run.html_url"
   target="_blank"
   rel="noopener noreferrer"
   (click)="onClick($event)"
   [attr.aria-label]="getStatusClass() === 'failure'
     ? ('Inspect failed build: ' + run.name)
     : ('Open workflow run on GitHub: ' + run.name)">
  <div class="build-status-icon" [class]="'icon-' + getStatusClass()">
    {{ getStatusIcon() }}
  </div>
  <div class="build-info">
    <div class="build-name">{{ run.name }}</div>
    <div class="build-commit">{{ run.head_commit.message | slice:0:60 }}{{ run.head_commit.message.length > 60 ? '...' : '' }}</div>
    <div class="build-meta">
      <span class="build-author">{{ run.head_commit.author.name }}</span>
      <span class="build-time">{{ getTimeAgo(run.updated_at) }}</span>
    </div>
  </div>
  <div class="build-conclusion" [class]="'label-' + getStatusClass()">
    {{ (run.conclusion || run.status) | uppercase }}
  </div>
</a>
