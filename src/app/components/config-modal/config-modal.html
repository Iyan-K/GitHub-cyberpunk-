<div class="modal-overlay">
  <div class="modal-panel">
    <div class="modal-header">
      <span class="glitch-text" data-text="// SYSTEM CONFIG //">// SYSTEM CONFIG //</span>
      <button class="close-btn" (click)="cancel()">✕</button>
    </div>
    <div class="modal-body">
      <div class="field-group">
        <label class="field-label">GITHUB TOKEN <span class="optional">(optional)</span></label>
        <input
          type="password"
          class="cyber-input"
          placeholder="ghp_xxxxxxxxxxxxxxxxxxxx"
          [(ngModel)]="token"
        />
        <small class="hint">For private repos or higher rate limits. Leave empty for public repos.</small>
      </div>
      <div class="field-group">
        <label class="field-label">OWNER / ORGANIZATION *</label>
        <input
          type="text"
          class="cyber-input"
          placeholder="e.g. angular"
          [(ngModel)]="owner"
        />
      </div>
      <div class="field-group">
        <label class="field-label">REPOSITORY *</label>
        <input
          type="text"
          class="cyber-input"
          placeholder="e.g. angular"
          [(ngModel)]="repo"
        />
      </div>

      <div class="field-divider">// FIXER'S BRIEF (LLM) — OPTIONAL //</div>

      <div class="field-group">
        <label class="field-label">LLM API KEY <span class="optional">(optional)</span></label>
        <input
          type="password"
          class="cyber-input"
          placeholder="sk-..."
          [(ngModel)]="llmApiKey"
        />
        <small class="hint">Powers cyberpunk-themed error briefings on failed builds. Leave empty to disable.</small>
      </div>
      <div class="field-group">
        <label class="field-label">LLM ENDPOINT <span class="optional">(optional)</span></label>
        <input
          type="text"
          class="cyber-input"
          placeholder="https://api.openai.com/v1/chat/completions"
          [(ngModel)]="llmEndpoint"
        />
        <small class="hint">Any OpenAI-compatible chat completions URL. Defaults to OpenAI.</small>
      </div>
      <div class="field-group">
        <label class="field-label">LLM MODEL <span class="optional">(optional)</span></label>
        <input
          type="text"
          class="cyber-input"
          placeholder="gpt-4o-mini"
          [(ngModel)]="llmModel"
        />
      </div>
    </div>
    <div class="modal-footer">
      <button class="cyber-btn secondary" (click)="cancel()">CANCEL</button>
      <button class="cyber-btn primary" (click)="save()" [disabled]="!owner || !repo">CONNECT</button>
    </div>
  </div>
</div>
